          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
          description: Mảng một chiều. 1 là thứ Hai, 7 là Chủ nhật. Không nhận phần tử null.
