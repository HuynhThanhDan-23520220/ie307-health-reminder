          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,6})?$
          example: 09:00:00
          description: Giờ địa phương theo profiles.time_zone. App gửi HH:mm:ss, có thể có phần giây lẻ.
        days_of_week:
