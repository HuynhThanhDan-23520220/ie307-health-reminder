            minimum: 1
            maximum: 7
          description: Mảng một chiều. 1 là thứ Hai, 7 là Chủ nhật. Không nhận phần tử null.
          default:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
        enabled:
          type: boolean
          default: true
      required:
      - local_time
      additionalProperties: false
    UpdateReminderSchedule:
      type: object
      properties:
