          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
          description: Mảng một chiều. 1 là thứ Hai, 7 là Chủ nhật. Không nhận phần tử null.
        enabled:
          type: boolean
      minProperties: 1
      additionalProperties: false
  responses:
    InvalidData:
      description: JSON, kiểu dữ liệu, CHECK, NOT NULL hoặc cú pháp bộ lọc không hợp lệ. Mã thường gặp 23514, 23502,
        22P02, PGRST100.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataError'
    InvalidJwt:
      description: JWT không hợp lệ hoặc hết hạn, hoặc request chưa có phiên hợp lệ. Gateway có thể trả cấu trúc
        khác.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataError'
          examples:
            example:
              value:
                code: PGRST301
                message: JWT expired
                details: null
                hint: null
    Forbidden:
      description: Thiếu quyền thao tác theo bảng/cột hoặc vi phạm RLS WITH CHECK. SELECT bị RLS lọc dòng thường
        trả 200 với [].
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataError'
          examples:
            example:
              value:
                code: '42501'
                message: permission denied
                details: null
                hint: null
    Conflict:
      description: Vi phạm UNIQUE 23505 hoặc khóa ngoại 23503. Kiểm tra tên ràng buộc trước khi xử lý yêu cầu lặp.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataError'
    AuthFailure:
      description: Thông tin đăng nhập hoặc refresh token bị từ chối. Dùng error_code để xử lý. Đối chiếu status
        thực tế trên project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          examples:
            example:
              value:
                code: 400
                error_code: invalid_credentials
                msg: Invalid login credentials
    AuthJwtFailure:
      description: Phiên hoặc JWT không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
